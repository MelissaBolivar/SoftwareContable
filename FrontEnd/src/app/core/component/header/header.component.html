<header *ngIf="isLogged">
  <p-toolbar styleClass="custom-toolbar">
    <!-- 🔹 Menú lateral + título -->
    <div class="p-toolbar-group-left">
      <button
        pButton
        type="button"
        icon="pi pi-bars"
        class="p-button-secondary toggle-btn"
        (click)="toggleSidebar()"
        title="Abrir menú"
      ></button>

      <span class="separator"></span>

      <!-- 🔹 Logo corporativo -->
      <span
        class="app-title"
        (click)="goHome()"
        style="cursor: pointer;"
        title="Ir al inicio"
      >
        💠 <i>Money Guardian</i> 💠
      </span>
    </div>

    <!-- 🔹 Usuario / opciones -->
    <div class="p-toolbar-group-right">
      <div class="user-avatar">
        <p-avatar
          icon="pi pi-user"
          shape="circle"
          title="{{ userName | titlecase }}"
        ></p-avatar>
        <span class="label-usuario">{{ userName | titlecase }}</span>
      </div>

      <span class="separator"></span>

      <button
        pButton
        type="button"
        class="p-button-secondary dropdown-toggle"
        icon="pi pi-ellipsis-v"
        (click)="toggleDropdown()"
        title="Opciones"
        tooltipPosition="bottom"
      ></button>

      <!-- Menú desplegable -->
      <div class="dropdown-menu" [class.show]="dropdownVisible">
        <button class="dropdown-item" (click)="logout()">🚪 Cerrar sesión</button>
      </div>
    </div>
  </p-toolbar>
</header>

<!-- 🔹 Sidebar -->
<p-sidebar
  [(visible)]="sidebarVisible"
  [baseZIndex]="10000"
  *ngIf="isLogged"
  position="left"
  styleClass="custom-sidebar"
>
  <div class="sidebar-header">
    <h3>📊 Panel de Control</h3>
  </div>

  <p-panelMenu
    [model]="menuItems"
    [style]="{ width: '100%' }"
    styleClass="sidebar-menu"
  ></p-panelMenu>
</p-sidebar>
