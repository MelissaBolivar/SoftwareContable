<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Guardian - Servicios</title>

  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />

  <style>
    :root {
      --primary: #008cff;
      --accent: #00b8ff;
      --danger: #ff4d4d;
      --success: #00d084;
      --text-color: #f0f6ff;
      --text-muted: #9fb7d1;
      --card-bg: #0c1b2f;
      --card-hover: #132b47;
      --table-row-bg: #11253f;
      --table-row-hover: #1c3a61;
      --shadow: 0 0 25px rgba(0, 140, 255, 0.08);
      --scrollbar-thumb: #00b8ff;
      --scrollbar-track: #0a1728;
      --radius: 14px;
    }

    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      background: #081425;
      color: var(--text-color);
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .servicio-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 90%;
      max-width: 1050px;
      padding: 1.5rem;
      margin: 2rem 0;
      transition: all 0.3s ease;
      max-height: 75vh;
      overflow-y: auto;
    }

    .servicio-container:hover { background: var(--card-hover); }

    .servicio-container::-webkit-scrollbar { width: 8px; }
    .servicio-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
    .servicio-container::-webkit-scrollbar-track { background: var(--scrollbar-track); }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      gap: 1rem;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: 700;
    }

    .header-title i { color: var(--accent); font-size: 1.4rem; }

    .search-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
      max-width: 340px;
    }

    .search-input {
      flex: 1;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(0, 184, 255, 0.25);
      background: #132a4a;
      color: var(--text-color);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 184, 255, 0.3);
    }

    .panel-animated { transition: max-height 0.4s ease, padding 0.3s ease; overflow: hidden; }
    .collapsed { max-height: 0 !important; padding: 0 !important; }

    .icon-btn {
      width: 2rem;
      height: 2rem;
      padding: 0.25rem !important;
      font-size: 0.9rem;
      border-radius: 50% !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    table.centered-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.88rem;
    }
    table.centered-table th {
      background: rgba(0, 184, 255, 0.08);
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.6rem;
      border-bottom: 2px solid rgba(0, 184, 255, 0.2);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(3px);
      cursor: pointer;
    }
    table.centered-table th:hover {
      background: rgba(0, 184, 255, 0.15);
      transition: background 0.3s ease;
    }
    table.centered-table td {
      color: var(--text-color);
      padding: 0.55rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
    }
    table.centered-table tbody tr:hover { background: var(--table-row-hover); transform: translateY(-1px); }

    .cell-name { font-weight: 500; }

    .inactive { color: var(--text-muted); }

    @media (max-width: 900px) {
      .servicio-container { max-height: 70vh; padding: 1rem; }
      .header-title { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="servicio-container">
    <!-- Servicios Activos -->
    <div class="header-row">
      <h3 class="header-title"><i class="pi pi-briefcase"></i> Servicios Activos</h3>
      <div class="search-group">
        <input #searchInput type="text" placeholder="Buscar por nombre o código"
               [(ngModel)]="nombreFiltro" (input)="filtrarServicios()"
               class="search-input" />
        <p-button icon="pi pi-search" styleClass="p-button-rounded p-button-text icon-btn p-button-info"
                  (click)="focusBusqueda()"></p-button>
      </div>
      <div class="action-group">
        <p-button icon="pi pi-plus" styleClass="p-button-rounded p-button-text icon-btn p-button-success"
                  (click)="new()"></p-button>
        <p-button icon="pi pi-chevron-down" styleClass="p-button-rounded p-button-text icon-btn p-button-info"
                  (click)="toggleActive = !toggleActive"
                  [attr.aria-expanded]="toggleActive"></p-button>
      </div>
    </div>

    <div class="panel-animated" [ngClass]="{ collapsed: !toggleActive }">
      <p-table [value]="infoTable" dataKey="servicioId" [paginator]="true" [rows]="10"
               [rowsPerPageOptions]="[5,10]" [loading]="loading"
               class="centered-table" [rowHover]="true" sortMode="multiple">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="codigo">Código <p-sortIcon field="codigo"></p-sortIcon></th>
            <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-infoComponent>
          <tr>
            <td>{{ infoComponent.codigo }}</td>
            <td class="cell-name">{{ infoComponent.nombre }}</td>
            <td>
              <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text icon-btn p-button-info"
                        (click)="edit(infoComponent, $event)"></p-button>
              <p-button icon="pi pi-times" styleClass="p-button-rounded p-button-text icon-btn p-button-warning"
                        (click)="confirmDesactivar(infoComponent.servicioId, infoComponent.nombre)"></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="3" class="empty-msg">No se encontró información.</td></tr>
        </ng-template>
      </p-table>
    </div>

    <hr class="divider" />

    <!-- Servicios Inactivos -->
    <div class="header-row">
      <h3 class="header-title inactive"><i class="pi pi-folder"></i> Servicios Inactivos</h3>
      <div class="action-group">
        <p-button icon="pi pi-chevron-down" styleClass="p-button-rounded p-button-text icon-btn p-button-info"
                  (click)="toggleInactive = !toggleInactive"
                  [attr.aria-expanded]="toggleInactive"></p-button>
      </div>
    </div>

    <div class="panel-animated" [ngClass]="{ collapsed: !toggleInactive }">
      <p-table [value]="serviciosDesactivados" dataKey="servicioId"
               [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10]"
               class="centered-table" [rowHover]="true" sortMode="multiple">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="codigo">Código <p-sortIcon field="codigo"></p-sortIcon></th>
            <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-serv>
          <tr>
            <td>{{ serv.codigo }}</td>
            <td class="cell-name">{{ serv.nombre }}</td>
            <td>
              <p-button icon="pi pi-check" styleClass="p-button-rounded p-button-text icon-btn p-button-success"
                        (click)="confirmReactivar(serv.servicioId, serv.nombre)"></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="3" class="empty-msg">No hay servicios desactivados.</td></tr>
        </ng-template>
      </p-table>
    </div>

    <p-confirmDialog></p-confirmDialog>
  </div>
</body>
</html>
