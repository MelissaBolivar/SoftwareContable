<!-- 💎 Money Guardian - Módulo de Servicios -->
<div class="servicios-wrapper fade-in">
  <div class="servicios-panel">
    <!-- 🔷 Encabezado principal -->
    <header class="servicios-header">
      <span class="servicios-icon">📦</span>
      <h2 class="servicios-title">Gestión de Servicios</h2>
    </header>

    <!-- 🔍 Barra de búsqueda -->
    <div class="servicios-filtro">
      <input
        #searchInput
        type="text"
        placeholder="Buscar por nombre o código..."
        [(ngModel)]="nombreFiltro"
        (input)="filtrarServicios()"
        class="search-input"
      />
      <button
        pButton
        type="button"
        icon="pi pi-search"
        class="p-button-rounded p-button-info search-btn"
      ></button>
    </div>

    <!-- 📘 Tabla de servicios activos -->
    <section class="servicios-section">
      <div class="section-header">
        <h3 class="section-title glow-text">
          <i class="pi pi-box"></i> Servicios Activos
        </h3>
        <div class="section-actions">
          <button
            pButton
            icon="pi pi-plus"
            class="p-button-rounded p-button-success icon-btn"
            (click)="new()"
          ></button>
          <button
            pButton
            icon="pi pi-chevron-down"
            class="p-button-rounded p-button-info icon-btn"
            (click)="toggleActive = !toggleActive"
            [attr.aria-expanded]="toggleActive"
          ></button>
        </div>
      </div>

      <div class="panel-animated" [ngClass]="{ collapsed: !toggleActive }">
        <p-table
          [value]="infoTable"
          dataKey="servicioId"
          [paginator]="true"
          [rows]="8"
          [rowsPerPageOptions]="[5, 10]"
          [loading]="loading"
          [rowHover]="true"
          sortMode="multiple"
          class="money-table"
        >
          <ng-template pTemplate="header">
            <tr>
              <th pSortableColumn="codigo">
                Código <p-sortIcon field="codigo"></p-sortIcon>
              </th>
              <th pSortableColumn="nombre">
                Nombre <p-sortIcon field="nombre"></p-sortIcon>
              </th>
              <th>Acciones</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-infoComponent>
            <tr>
              <td>{{ infoComponent.codigo }}</td>
              <td>{{ infoComponent.nombre }}</td>
              <td>
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-text p-button-info icon-btn"
                  (click)="edit(infoComponent, $event)"
                ></button>
                <button
                  pButton
                  icon="pi pi-times"
                  class="p-button-rounded p-button-text p-button-warning icon-btn"
                  (click)="confirmDesactivar(infoComponent.servicioId, infoComponent.nombre)"
                ></button>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="3">No se encontró información.</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </section>

    <!-- 💤 Servicios inactivos -->
    <section class="servicios-section inactive-section">
      <div class="section-header">
        <h3 class="section-title inactive glow-text">
          <i class="pi pi-folder"></i> Servicios Inactivos
        </h3>
        <button
          pButton
          icon="pi pi-chevron-down"
          class="p-button-rounded p-button-info icon-btn"
          (click)="toggleInactive = !toggleInactive"
          [attr.aria-expanded]="toggleInactive"
        ></button>
      </div>

      <div class="panel-animated" [ngClass]="{ collapsed: !toggleInactive }">
        <p-table
          [value]="serviciosDesactivados"
          dataKey="servicioId"
          [paginator]="true"
          [rows]="8"
          [rowsPerPageOptions]="[5, 10]"
          class="money-table"
          [rowHover]="true"
          sortMode="multiple"
        >
          <ng-template pTemplate="header">
            <tr>
              <th pSortableColumn="codigo">
                Código <p-sortIcon field="codigo"></p-sortIcon>
              </th>
              <th pSortableColumn="nombre">
                Nombre <p-sortIcon field="nombre"></p-sortIcon>
              </th>
              <th>Acciones</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-prod>
            <tr>
              <td>{{ prod.codigo }}</td>
              <td>{{ prod.nombre }}</td>
              <td>
                <button
                  pButton
                  icon="pi pi-check"
                  class="p-button-rounded p-button-text p-button-success icon-btn"
                  (click)="confirmReactivar(prod.servicioId, prod.nombre)"
                ></button>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="3">No hay servicios desactivados.</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </section>

    <p-confirmDialog></p-confirmDialog>
  </div>
</div>

<!-- 🎨 ESTILOS -->
<style>
  .servicios-wrapper {
    background: radial-gradient(circle at top left, #0f172a, #020617);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem;
    font-family: "Poppins", sans-serif;
    color: #e2e8f0;
    overflow-y: auto; /* permite desplazamiento vertical de la página */
  }

  /* mantengo panel scrollable para listas largas - visual solamente */
  .servicios-panel {
    width: 90%;
    max-width: 1000px;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    border-radius: 1.25rem;
    box-shadow:
      0 0 25px rgba(56, 189, 248, 0.15),
      inset 0 0 15px rgba(56, 189, 248, 0.05);
    padding: 2rem;
    transition: all 0.4s ease;
    max-height: 80vh;       /* limita altura y permite scroll interno */
    overflow-y: auto;      /* scroll interno para la lista sin romper layout */
    scrollbar-width: thin;
    scrollbar-color: rgba(56,189,248,0.6) transparent;
  }

  .servicios-header {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
    color: #38bdf8;
  }

  .servicios-icon {
    font-size: 1.8rem;
  }

  .servicios-title {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0;
  }

  .glow-text {
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
  }

  .servicios-filtro {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.8rem;
  }

  .search-input {
    flex: 1;
    padding: 0.6rem 0.9rem;
    border-radius: 10px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    background: linear-gradient(180deg, #0f2438, #132a4a); /* más contraste en campo */
    color: #f1f9ff; /* texto más claro para que se vea */
    font-size: 0.95rem;
    transition: all 0.3s ease;
  }

  .search-input::placeholder {
    color: rgba(226, 232, 240, 0.6);
  }

  .search-input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }

  .search-btn {
    padding: 0.5rem;
  }

  .servicios-section {
    margin-bottom: 2rem;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.8rem;
    gap: 1rem;
  }

  .section-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: #60a5fa;
    margin: 0;
  }

  .section-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .inactive {
    color: #9aa6b6 !important; /* tono claro para el label inactivo */
  }

  .icon-btn {
    width: 2rem;
    height: 2rem;
  }

  /* TABLA: mantengo estructura y comportamiento idénticos */
  .money-table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-family: "Poppins", sans-serif;
    font-size: 0.95rem;
  }

  .money-table th {
    background: linear-gradient(180deg, rgba(24,30,44,0.98), rgba(30,41,59,0.95));
    color: #bfe8ff; /* cabezera más clara */
    padding: 0.9rem;
    font-weight: 600;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    position: sticky;
    top: 0;
    z-index: 3;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  /* Filas: contraste fuerte para que el contenido se vea (corrección de "amarillo" que no se veía) */
  .money-table td {
    padding: 0.8rem;
    color: #e9f8ff;
    background: rgba(15, 23, 36, 0.85); /* fondo oscuro y semi-opaco */
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }

  /* filas alternadas para mejorar lectura */
  .money-table tr:nth-child(even) td {
    background: rgba(18, 28, 46, 0.88);
  }

  /* hover claro y consistente */
  .money-table tr:hover td {
    background: linear-gradient(90deg, rgba(56,189,248,0.08), rgba(56,189,248,0.06));
    color: #f8feff;
  }

  /* Aseguro que servicios inactivos usen el mismo esquema visual (solo ligeramente apagado) */
  .inactive-section .money-table th {
    background: linear-gradient(180deg, rgba(20,26,38,0.98), rgba(28,38,52,0.95));
    color: #9fb7d1;
  }

  .inactive-section .money-table td {
    background: rgba(14, 18, 28, 0.82);
    color: #d8e6ef;
  }

  .inactive-section .money-table tr:nth-child(even) td {
    background: rgba(16, 22, 34, 0.86);
  }

  .inactive-section .money-table tr:hover td {
    background: linear-gradient(90deg, rgba(56,189,248,0.06), rgba(56,189,248,0.04));
  }

  /* panel-animated conserva overflow hidden para animación, no cambia funcionalidad */
  .panel-animated {
    transition: max-height 0.4s ease, padding 0.3s ease;
    overflow: hidden;
  }

  .collapsed {
    max-height: 0 !important;
    padding: 0 !important;
  }

  .fade-in {
    animation: fadeIn 0.9s ease forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsivo: mismas clases que tenías, sólo ajustes visuales */
  @media (max-width: 900px) {
    .servicios-panel {
      padding: 1.2rem;
      max-height: 85vh;
    }

    .search-input {
      font-size: 0.9rem;
    }
  }

  @media (max-width: 640px) {
    .servicios-title {
      font-size: 1.2rem;
    }

    .section-title {
      font-size: 1rem;
    }

    .money-table th,
    .money-table td {
      padding: 0.55rem;
      font-size: 0.86rem;
    }
  }
</style>
