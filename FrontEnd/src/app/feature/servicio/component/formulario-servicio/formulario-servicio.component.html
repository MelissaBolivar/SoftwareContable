<form [formGroup]="componentForm" (ngSubmit)="onSubmit()" class="fp-card mg-card">
  <header class="fp-card__header">
    <div>
      <h2 class="fp-card__title">
        {{ headerName || ((action || '').toLowerCase() === 'crear' ? 'Nuevo producto' : 'Editar producto') }}
      </h2>
      <p class="fp-card__subtitle">
        Rellena los campos para {{ (action || '').toLowerCase() === 'crear' ? 'crear' : 'actualizar' }} el producto
      </p>
    </div>

    <div class="fp-card__close">
      <p-button icon="pi pi-times" styleClass="fp-close-btn" (click)="onClose()" [disabled]="loading" aria-label="Cerrar"></p-button>
    </div>
  </header>

  <section class="fp-card__body">
    <div class="fp-form-row">
      <label class="fp-field">
        <span class="fp-field__label">Código *</span>
        <input id="codigo" pInputText formControlName="codigo" placeholder="Ej: 00123" autocomplete="off"
          [ngClass]="{ 'is-invalid': componentForm.get('codigo')?.invalid && (componentForm.get('codigo')?.dirty || componentForm.get('codigo')?.touched) }" />
        <div class="fp-field__help" *ngIf="componentForm.get('codigo')?.invalid && (componentForm.get('codigo')?.dirty || componentForm.get('codigo')?.touched)">
          <small *ngIf="componentForm.get('codigo')?.hasError('required')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> {{ requiredField }}
          </small>
          <small *ngIf="componentForm.get('codigo')?.hasError('duplicado')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> Ya existe un producto con ese código.
          </small>
          <small *ngIf="componentForm.get('codigo')?.hasError('pattern')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> Solo se permiten números en el código.
          </small>
        </div>
      </label>

      <label class="fp-field">
        <span class="fp-field__label">Nombre *</span>
        <input id="nombre" pInputText formControlName="nombre" placeholder="Ej: Producto Premium" autocomplete="off"
          [ngClass]="{ 'is-invalid': componentForm.get('nombre')?.invalid && (componentForm.get('nombre')?.dirty || componentForm.get('nombre')?.touched) }" />
        <div class="fp-field__help" *ngIf="componentForm.get('nombre')?.invalid && (componentForm.get('nombre')?.dirty || componentForm.get('nombre')?.touched)">
          <small *ngIf="componentForm.get('nombre')?.hasError('required')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> {{ requiredField }}
          </small>
        </div>
      </label>
    </div>
  </section>

  <footer class="fp-card__footer">
    <button pButton type="button" class="fp-btn fp-btn--ghost" (click)="onClose()" [disabled]="loading">
      <i class="pi pi-ban"></i> Cancelar
    </button>

    <p-button label="{{ (action || '').toLowerCase() === 'crear' ? 'Crear' : 'Guardar' }}" icon="pi pi-check"
      styleClass="fp-btn fp-btn--primary fp-anim" type="submit" [disabled]="!componentForm.valid || loading"></p-button>
  </footer>

  <div class="fp-overlay" *ngIf="loading">
    <p-progressSpinner [style]="{ 'width.px': 44, 'height.px': 44 }"></p-progressSpinner>
  </div>

  <p-dialog header="Código duplicado" [(visible)]="mostrarDialogoDuplicado" [modal]="true" [dismissableMask]="true" [ngStyle]="{ width: '28rem' }" class="mg-dialog">
    <p class="mg-dialog-text">Ya existe un producto con ese código. Por favor ingresa uno diferente.</p>
    <p-footer>
      <p-button label="Entendido" (click)="mostrarDialogoDuplicado = false" styleClass="mg-primary"></p-button>
    </p-footer>
  </p-dialog>
</form>
