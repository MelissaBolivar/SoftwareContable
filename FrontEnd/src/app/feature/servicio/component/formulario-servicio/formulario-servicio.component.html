<form [formGroup]="componentForm" (ngSubmit)="onSubmit()" class="fp-card">
  <header class="fp-card__header">
    <div>
      <h2 class="fp-card__title">
        {{ headerName || ((action || '').toLowerCase() === 'crear' ? 'Nuevo servicio' : 'Editar servicio') }}
      </h2>
      <p class="fp-card__subtitle">
        Rellena los campos para {{ (action || '').toLowerCase() === 'crear' ? 'crear' : 'actualizar' }} el servicio
      </p>
    </div>

    <div class="fp-card__close">
      <p-button icon="pi pi-times" styleClass="fp-close-btn" (click)="onClose()" [disabled]="loading" [attr.aria-label]="'Cerrar'"></p-button>
    </div>
  </header>

  <section class="fp-card__body">
    <div class="fp-form-row">
      <label class="fp-field">
        <span class="fp-field__label">Código *</span>
        <input id="codigo" pInputText formControlName="codigo" placeholder="Ingresa código" autocomplete="off"
          [ngClass]="{ 'is-invalid': componentForm.get('codigo')?.invalid && (componentForm.get('codigo')?.dirty || componentForm.get('codigo')?.touched) }" />
        <div class="fp-field__help" *ngIf="componentForm.get('codigo')?.invalid && (componentForm.get('codigo')?.dirty || componentForm.get('codigo')?.touched)">
          <small *ngIf="componentForm.get('codigo')?.hasError('required')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> {{ requiredField }}
          </small>
          <small *ngIf="componentForm.get('codigo')?.hasError('duplicado')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> Ya existe un servicio con ese código.
          </small>
          <small *ngIf="componentForm.get('codigo')?.hasError('pattern')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> Solo se permiten números en el código.
          </small>
        </div>
      </label>

      <label class="fp-field">
        <span class="fp-field__label">Nombre *</span>
        <input id="nombre" pInputText formControlName="nombre" placeholder="Nombre del servicio" autocomplete="off"
          [ngClass]="{ 'is-invalid': componentForm.get('nombre')?.invalid && (componentForm.get('nombre')?.dirty || componentForm.get('nombre')?.touched) }" />
        <div class="fp-field__help" *ngIf="componentForm.get('nombre')?.invalid && (componentForm.get('nombre')?.dirty || componentForm.get('nombre')?.touched)">
          <small *ngIf="componentForm.get('nombre')?.hasError('required')" class="fp-error">
            <img src="/assets/svg/required.svg" alt="" class="fp-erricon" /> {{ requiredField }}
          </small>
        </div>
      </label>
    </div>
  </section>

  <footer class="fp-card__footer">
    <button pButton type="button" class="fp-btn fp-btn--ghost" (click)="onClose()" [disabled]="loading">
      <i class="pi pi-ban"></i> Cancelar
    </button>

    <p-button label="{{ (action || '').toLowerCase() === 'crear' ? 'Crear' : 'Guardar' }}" icon="pi pi-check"
      styleClass="fp-btn fp-btn--primary fp-anim" type="submit" [disabled]="!componentForm.valid || loading"></p-button>
  </footer>

  <div class="fp-overlay" *ngIf="loading"><p-progressSpinner [style]="{ 'width.px': 44, 'height.px': 44 }"></p-progressSpinner></div>

  <p-dialog header="Código duplicado" [(visible)]="mostrarDialogoDuplicado" [modal]="true" [dismissableMask]="true" [ngStyle]="{ width: '24rem' }">
    <p>Ya existe un servicio con ese código. Por favor ingresa uno diferente.</p>
    <p-footer><p-button label="Entendido" (click)="mostrarDialogoDuplicado = false"></p-button></p-footer>
  </p-dialog>
</form>

<style>
:root{
  --bg:#fff9f4;
  --card:#ffffff;
  --accent:#0b63d6;
  --accent-2:#1470e6;
  --muted:#55636c;
  --danger:#d64545;
  --glass: rgba(255,255,255,0.7);
}

.fp-card{
  width:100%; max-width:720px; margin:18px auto;
  background: linear-gradient(180deg,var(--card), #fbfcff);
  border-radius:12px; padding:16px; position:relative;
  box-shadow: 0 18px 36px rgba(11,99,214,0.06), 0 6px 18px rgba(0,0,0,0.04);
  border-left:6px solid rgba(11,99,214,0.06);
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  overflow:hidden;
}

.fp-card__header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.fp-card__title{ margin:0; color:var(--accent); font-size:1.2rem; font-weight:700; }
.fp-card__subtitle{ margin:2px 0 0 0; color:var(--muted); font-size:0.85rem; }

.fp-close-btn .p-button-icon{ color:var(--muted); }
.fp-close-btn{ background:transparent !important; border-radius:999px !important; border:1px solid rgba(11,99,214,0.06) !important; box-shadow:none !important; padding:6px !important; }

.fp-card__body{ padding:12px 0; }
.fp-form-row{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:720px){ .fp-form-row{ grid-template-columns:1fr 1fr; } }

.fp-field{ display:flex; flex-direction:column; gap:6px; }
.fp-field__label{ font-size:0.82rem; color:var(--muted); font-weight:600; }

input[pInputText]{
  padding:10px 12px; border-radius:10px; border:1px solid rgba(16,24,40,0.06);
  background:linear-gradient(180deg,#ffffff,#fbfdff); font-weight:600; color:#16323b;
  transition: box-shadow .12s ease, transform .12s ease, border-color .12s ease;
}
input[pInputText]:focus{ outline:none; box-shadow: 0 10px 26px rgba(20,112,255,0.09); transform: translateY(-2px); border-color: rgba(11,99,214,0.28); }

.is-invalid{ border-color: var(--danger) !important; box-shadow: 0 6px 18px rgba(214,65,65,0.06); }

.fp-field__help{ min-height:18px; font-size:0.82rem; color:var(--danger); display:flex; gap:8px; align-items:center; }
.fp-erricon{ width:18px; height:auto; filter:drop-shadow(0 1px 4px rgba(0,0,0,0.06)); }

.fp-card__footer{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; }
.fp-btn{ padding:10px 14px; border-radius:12px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
.fp-btn--ghost{ background:transparent; border:1px solid rgba(16,24,40,0.06); color:var(--muted); }
.fp-btn--ghost:hover{ transform: translateY(-6px) rotate(-1deg); box-shadow: 0 14px 36px rgba(11,99,214,0.06); }

.fp-primary .p-button-label, .fp-primary .p-button-icon{ color:#fff !important; }
.fp-btn--primary{ background: linear-gradient(90deg,var(--accent), var(--accent-2)) !important; border:none !important; color:#fff; box-shadow: 0 18px 44px rgba(11,99,214,0.12); transform-origin:center bottom; }

.fp-anim{ animation: bounce 3s ease-in-out infinite; }
@keyframes bounce{ 0%{ transform:translateY(0);} 30%{ transform:translateY(-8px);} 50%{ transform:translateY(0);} 70%{ transform:translateY(-4px);} 100%{ transform:translateY(0);} }

.fp-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at center, rgba(255,255,255,0.72), rgba(255,255,255,0.9)); border-radius:12px; }

.p-button{ font-weight:800; border-radius:12px; }
.p-button .pi{ margin-right:6px; }
</style>
