<form [formGroup]="componentForm" (ngSubmit)="guardar()" class="mg-form">
  <!-- Número de Factura -->
  <div class="mg-field">
    <label for="numeroFactura">Número de Factura*</label>
    <input type="text" pInputText formControlName="numeroFactura" id="numeroFactura" placeholder="Número" />
  </div>

  <!-- Fecha -->
  <div class="mg-field">
    <label for="fecha">Fecha*</label>
    <p-calendar
      formControlName="fecha"
      id="fecha"
      dateFormat="dd MM yy"
      showIcon="true"
      [locale]="customLocale"
      styleClass="w-full"
    ></p-calendar>
  </div>

  <!-- Proveedor -->
  <div class="mg-field">
    <label for="terceroId">Proveedor*</label>
    <p-dropdown
      [options]="tercero"
      optionLabel="nombre"
      optionValue="terceroId"
      formControlName="terceroId"
      placeholder="Selecciona un Proveedor"
      id="terceroId"
    ></p-dropdown>
  </div>

  <!-- Tipo de Pago -->
  <div class="mg-field">
    <label for="tipoPagoId">Tipo de Pago*</label>
    <p-dropdown
      [options]="tipoPago"
      optionLabel="nombre"
      optionValue="tipoPagoId"
      formControlName="tipoPagoId"
      placeholder="Selecciona tipo de pago"
      id="tipoPagoId"
    ></p-dropdown>
  </div>

  <!-- Tipo de Factura -->
  <div class="mg-field">
    <label for="tipoFacturaId">Tipo de Factura*</label>
    <p-dropdown
      [options]="tipoFactura"
      optionLabel="nombre"
      optionValue="tipoFacturaId"
      formControlName="tipoFacturaId"
      placeholder="Selecciona tipo de factura"
      id="tipoFacturaId"
    ></p-dropdown>
  </div>

  <!-- Anticipo -->
  <div class="mg-field">
    <label for="anticipoId">Anticipo*</label>
    <p-dropdown
      [options]="anticipo"
      optionLabel="nombre"
      optionValue="anticipoId"
      formControlName="anticipoId"
      placeholder="Selecciona anticipo"
      id="anticipoId"
    ></p-dropdown>
  </div>

  <!-- Productos -->
  <div formArrayName="detalleProducto" class="mg-section">
    <div *ngFor="let grupo of detalleProducto.controls; let i = index" [formGroupName]="i" class="mg-row">
      <div class="mg-field">
        <label [attr.for]="'productoId-' + i">Producto*</label>
        <p-dropdown
          [options]="producto"
          optionLabel="nombre"
          optionValue="productoId"
          formControlName="productoId"
          placeholder="Selecciona un producto"
          [id]="'productoId-' + i"
        ></p-dropdown>
      </div>

      <div class="mg-field">
        <label [attr.for]="'unidades-' + i">Unidades*</label>
        <input type="number" pInputText formControlName="unidades" [id]="'unidades-' + i" placeholder="Unidades" />
      </div>

      <div class="mg-field">
        <label [attr.for]="'precio-' + i">Precio*</label>
        <input type="number" pInputText formControlName="precio" [id]="'precio-' + i" placeholder="Precio" />
      </div>

      <div class="mg-field">
        <label>Total</label>
        <input type="number" pInputText [value]="grupo.get('unidades')?.value * grupo.get('precio')?.value" disabled />
      </div>
    </div>

    <div class="mg-actions">
      <button
        type="button"
        pButton
        label="Agregar"
        icon="pi pi-plus"
        (click)="agregarProducto()"
        class="mg-btn-add"
        [disabled]="action === 'ver'"
      ></button>
    </div>
  </div>

  <!-- Servicios -->
  <div formArrayName="detalleServicio" class="mg-section">
    <div *ngFor="let grupo of detalleServicio.controls; let i = index" [formGroupName]="i" class="mg-row">
      <div class="mg-field">
        <label [attr.for]="'servicioId-' + i">Servicio*</label>
        <p-dropdown
          [options]="servicio"
          optionLabel="nombre"
          optionValue="servicioId"
          formControlName="servicioId"
          placeholder="Selecciona un servicio"
          [id]="'servicioId-' + i"
        ></p-dropdown>
      </div>

      <div class="mg-field">
        <label [attr.for]="'unidades-serv-' + i">Unidades*</label>
        <input type="number" pInputText formControlName="unidades" [id]="'unidades-serv-' + i" placeholder="Unidades" />
      </div>

      <div class="mg-field">
        <label [attr.for]="'precio-serv-' + i">Precio*</label>
        <input type="number" pInputText formControlName="precio" [id]="'precio-serv-' + i" placeholder="Precio" />
      </div>

      <div class="mg-field">
        <label>Total</label>
        <input type="number" pInputText [value]="grupo.get('unidades')?.value * grupo.get('precio')?.value" disabled />
      </div>
    </div>

    <div class="mg-actions">
      <button
        type="button"
        pButton
        label="Agregar"
        icon="pi pi-plus"
        (click)="agregarServicio()"
        class="mg-btn-add"
        [disabled]="action === 'ver'"
      ></button>
    </div>
  </div>

  <!-- Observaciones -->
  <div class="mg-field w-full">
    <label for="observaciones">Observaciones*</label>
    <textarea
      pInputTextarea
      formControlName="observaciones"
      id="observaciones"
      rows="3"
      placeholder="Observaciones"
    ></textarea>
  </div>

  <!-- Total general -->
  <div class="mg-field">
    <label for="total">Total</label>
    <input type="number" pInputText formControlName="total" id="total" [disabled]="true" />
  </div>

  <!-- Botón de Guardar -->
  <div class="mg-actions">
    <button
      type="submit"
      pButton
      label="Guardar"
      icon="pi pi-save"
      [disabled]="componentForm.invalid || loading || action === 'ver'"
      class="mg-btn-save"
    ></button>
  </div>
</form>
