<!-- 💎 Money Guardian - Saldo de Caja -->
<div class="caja-wrapper">
  <div class="caja-panel">
    <header class="caja-header">
      <span class="caja-icon">💰</span>
      <h2>Saldo de Caja</h2>
    </header>

  

    <section class="caja-body">
      <p-table
        #dt1
        [value]="infoTable"
        dataKey="id"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10]"
        [loading]="loading"
        [paginator]="true"
        class="caja-table"
        [globalFilterFields]="['fecha', 'saldoCaja']"
      >
        <ng-template pTemplate="header">
          <tr>
            <th >
              FECHA 
            </th>
            <th >
              CONCEPTO 
            </th>
            
            <th >
              SALDO CAJA 
            </th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-infoComponent>
          <tr>
            <td>{{ infoComponent.fechaRegistro | date: 'dd MMMM yyyy, HH:mm:ss' }}</td>
            <td>{{ infoComponent.concepto }}</td>
            <td>{{ infoComponent.saldo | currency:'COP':'symbol':'1.0-0' }}</td>
          </tr>
        </ng-template>
      </p-table>
    </section>
  </div>
</div>
